<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#4338ca"/>
  <!-- Calendar binder rings -->
  <line x1="11" y1="5" x2="11" y2="9" stroke="#eef0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="5" x2="21" y2="9" stroke="#eef0ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Calendar page with header band -->
  <rect x="6" y="7" width="20" height="19" rx="3" fill="#eef0ff"/>
  <rect x="6" y="7" width="20" height="5" rx="3" fill="#c7cbff"/>
  <!-- Candlesticks: bullish, bearish, bullish -->
  <line x1="11" y1="14" x2="11" y2="24" stroke="#0f8f83" stroke-width="1"/>
  <rect x="9.5" y="17" width="3" height="5" rx=".5" fill="#0f8f83"/>
  <line x1="16" y1="13.5" x2="16" y2="22" stroke="#d61f45" stroke-width="1"/>
  <rect x="14.5" y="15" width="3" height="4.5" rx=".5" fill="#d61f45"/>
  <line x1="21" y1="14" x2="21" y2="21" stroke="#0f8f83" stroke-width="1"/>
  <rect x="19.5" y="15" width="3" height="4" rx=".5" fill="#0f8f83"/>
</svg>
