<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Vipin Kumar</title>
  <!-- Absolute paths: GitHub Pages serves this file for a missing URL at any depth -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <style>
    :root { --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --accent:#4338ca; --card:#ffffff; --line:#e2e8f0; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#e2e8f0; --muted:#94a3b8; --accent:#a5b4fc; --card:#111833; --line:#1e293b; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
           background:var(--bg); color:var(--fg); font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
    main { max-width:520px; width:100%; text-align:center; background:var(--card); border:1px solid var(--line);
           border-radius:16px; padding:40px 28px; }
    img { width:64px; height:64px; }
    h1 { font-size:1.5rem; margin:20px 0 8px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    nav { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a { color:var(--accent); font-weight:600; text-decoration:none; padding:10px 18px; border:1px solid var(--line); border-radius:10px; }
    a:hover, a:focus-visible { border-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/favicon.svg" alt="">
    <h1>Page not found</h1>
    <p>The page you were looking for has moved or no longer exists.</p>
    <nav>
      <a href="/">Home</a>
      <a href="/pages/resources.html">Resources</a>
      <a href="/pages/blog.html">Blog</a>
    </nav>
  </main>
</body>
</html>
