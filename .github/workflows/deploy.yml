name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Publish only the website. Repo tooling (.claude/, .github/, tests/, _archive/,
      # *.md notes, package.json, playwright config) stays in git but is not served.
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html vault.html 404.html robots.txt sitemap.xml favicon.ico .nojekyll \
                assets css js pages resources Blogs _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
